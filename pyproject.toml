[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flopyparser"
version = "2.0.0"
description = "Converts MODFLOW input files to a Python Flopy script"
authors = [
    {name = "Bas des Tombe", email = "bdestombe@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["flopy", "groundwater", "hydrology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
]
dependencies = [
    "numpy>=1.21.0",
    "nbformat>=4.3",
    "nbconvert>=5.1",
    "flopy>=3.2",
    "yapf",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/bdestombe/python-flopy-parser"
Repository = "https://github.com/bdestombe/python-flopy-parser"
"Bug Reports" = "https://github.com/bdestombe/python-flopy-parser/issues"

[project.scripts]
flopyparser = "flopyparser.flopyparser:main"

[tool.setuptools.packages.find]
include = ["flopyparser*"]

[tool.setuptools.package-data]
flopyparser = ["*.py"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
preview = true
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501", # line too long, handled by formatter
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 80
preview = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]